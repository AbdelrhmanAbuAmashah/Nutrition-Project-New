[project]
name = "nour-api"
version = "0.1.0"
description = "Source-backed nutrition diary and clinical workflow foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3",
  "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3", "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = "/tmp/nour-pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]
